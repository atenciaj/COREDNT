        .progress { height: 25px; border-radius: 10px; }
        .progress-bar { font-weight: bold; }
        .store-item { transition: all 0.3s ease; }
        .store-item:hover { transform: translateX(5px); }
        .store-item.completed { opacity: 0.6; text-decoration: line-through; }
        .log-area { max-height: 400px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 12px; }
        .log-entry { border-left: 3px solid #e94560; padding-left: 10px; margin-bottom: 5px; }

        .log-error { border-left-color: #dc3545; }

        function log(message, type = 'info') {
            const area = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            area.appendChild(entry);
            area.scrollTop = area.scrollHeight;
        }

        function updateProgress() {
            const pct = Math.round((processedItems / totalItems) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressBar').textContent = pct + '%';
        }

        function markStoreCompleted(name) {
            const el = document.querySelector(`[data-store="${name}"]`);
            if (el) el.classList.add('completed');

        // ============ EJECUCIÓN ============

        async function seedDatabase() {
            const btn = document.getElementById('btnSeed');
            btn.disabled = true;
            btn.textContent = 'Poblando base de datos...';

            log('Iniciando población de base de datos...', 'info');
            
            // Initialize DB
            await NDT.db.initDB();
            log('Base de datos inicializada', 'success');

            totalItems = stores.reduce((sum, s) => sum + s.items.length, 0);

            // Create store list UI
            const listEl = document.getElementById('storesList');
            stores.forEach(s => {
                const el = document.createElement('div');
                el.className = 'store-item list-group-item list-group-item-action';
                el.setAttribute('data-store', s.name);
                el.innerHTML = `<span class="badge bg-secondary me-2">${s.items.length}</span>${s.name}`;
                listEl.appendChild(el);
            });

            // Process each store
            for (const store of stores) {
                try {
                    log(`Guardando ${store.items.length} registros en ${store.name}...`, 'info');
                    for (const item of store.items) {
                        await NDT.db.saveSwellItem(store.name, item);
                        processedItems++;
                        updateProgress();
                    }
                    markStoreCompleted(store.name);
                    log(`${store.items.length} registros guardados en ${store.name}`, 'success');
                } catch (err) {
                    log(`Error en ${store.name}: ${err.message}`, 'error');
                }
            }

            log('¡Población completada!', 'success');
            btn.textContent = '✓ Base de Datos Poblada';
        }

        document.getElementById('btnSeed').addEventListener('click', seedDatabase);
