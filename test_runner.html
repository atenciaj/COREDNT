<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoliWel Integrity Validation Suite</title>
    <meta name="description" content="Automated technical validation for ASME/API integrity calculations">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --sw-gold: #d4af37;
            --sw-gold-dim: #b8962e;
            --sw-bg: #0a0e17;
            --sw-surface: #111827;
            --sw-surface-2: #1a2236;
            --sw-border: #1e293b;
            --sw-text: #e2e8f0;
            --sw-text-dim: #94a3b8;
            --sw-pass: #10b981;
            --sw-pass-bg: rgba(16, 185, 129, 0.08);
            --sw-fail: #ef4444;
            --sw-fail-bg: rgba(239, 68, 68, 0.08);
            --sw-blue: #3b82f6;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--sw-bg);
            color: var(--sw-text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* ── Header ───────────────────────────────────────── */
        .suite-header {
            background: linear-gradient(135deg, var(--sw-surface) 0%, var(--sw-surface-2) 100%);
            border-bottom: 1px solid var(--sw-border);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .suite-header .logo {
            width: 36px; height: 36px;
            background: var(--sw-gold);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem; color: #000;
        }
        .suite-header h1 {
            font-size: 1.25rem; font-weight: 600; margin: 0;
        }
        .suite-header h1 span { color: var(--sw-gold); }
        .suite-header .badge-version {
            font-size: 0.65rem;
            background: var(--sw-border);
            color: var(--sw-text-dim);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            margin-left: auto;
        }

        /* ── Layout ───────────────────────────────────────── */
        .suite-container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        .suite-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
        }

        /* ── Control Panel ────────────────────────────────── */
        .control-panel {
            position: sticky; top: 1.5rem;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .panel-card {
            background: var(--sw-surface);
            border: 1px solid var(--sw-border);
            border-radius: 12px;
            overflow: hidden;
        }
        .panel-card-header {
            padding: 0.75rem 1rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--sw-text-dim);
            border-bottom: 1px solid var(--sw-border);
        }
        .panel-card-body { padding: 1rem; }

        .btn-run {
            width: 100%;
            padding: 0.65rem;
            background: linear-gradient(135deg, var(--sw-gold), var(--sw-gold-dim));
            color: #000;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-run:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212,175,55,0.25); }
        .btn-run:active { transform: translateY(0); }
        .btn-run:disabled { opacity: 0.5; cursor: default; transform: none; filter: none; }
        .btn-run .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.6s linear infinite; }
        .btn-run.running .spinner { display: inline-block; }
        .btn-run.running .icon { display: none; }

        .btn-back {
            width: 100%;
            padding: 0.5rem;
            background: transparent;
            color: var(--sw-text-dim);
            font-size: 0.8rem;
            border: 1px solid var(--sw-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .btn-back:hover { color: var(--sw-text); border-color: var(--sw-text-dim); }

        /* ── Scoreboard ───────────────────────────────────── */
        .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .score-cell {
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
        }
        .score-cell.pass { background: var(--sw-pass-bg); border: 1px solid rgba(16,185,129,0.2); }
        .score-cell.fail { background: var(--sw-fail-bg); border: 1px solid rgba(239,68,68,0.2); }
        .score-val { font-size: 1.75rem; font-weight: 700; line-height: 1; }
        .score-cell.pass .score-val { color: var(--sw-pass); }
        .score-cell.fail .score-val { color: var(--sw-fail); }
        .score-label { font-size: 0.65rem; color: var(--sw-text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        .progress-bar-container {
            margin-top: 0.75rem;
            background: var(--sw-border);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
            background: var(--sw-pass);
        }
        .progress-fill.has-errors { background: linear-gradient(90deg, var(--sw-pass), var(--sw-fail)); }
        .progress-pct {
            text-align: center;
            font-size: 0.7rem;
            color: var(--sw-text-dim);
            margin-top: 4px;
        }

        /* ── Results Area ─────────────────────────────────── */
        .results-area { min-height: 300px; }
        .results-placeholder {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 300px;
            color: var(--sw-text-dim);
            text-align: center;
        }
        .results-placeholder i { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.3; }
        .results-placeholder p { font-size: 0.85rem; }

        /* ── Test Cards ───────────────────────────────────── */
        .test-card {
            background: var(--sw-surface);
            border: 1px solid var(--sw-border);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            animation: cardIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(8px);
        }
        .test-card.pass { border-left: 3px solid var(--sw-pass); }
        .test-card.fail { border-left: 3px solid var(--sw-fail); }

        .test-card-inner {
            display: flex;
            align-items: center;
            padding: 0.65rem 1rem;
            gap: 0.75rem;
        }
        .test-icon {
            width: 24px; height: 24px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; flex-shrink: 0;
        }
        .test-card.pass .test-icon { background: var(--sw-pass-bg); color: var(--sw-pass); }
        .test-card.fail .test-icon { background: var(--sw-fail-bg); color: var(--sw-fail); }

        .test-name {
            font-size: 0.8rem;
            font-weight: 500;
            flex: 1;
        }
        .test-details {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--sw-text-dim);
            max-width: 300px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Section headers in results */
        .test-section-header {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sw-gold);
            padding: 1rem 0 0.4rem 0;
            margin-top: 0.5rem;
        }
        .test-section-header:first-child { margin-top: 0; padding-top: 0; }

        /* ── Animations ───────────────────────────────────── */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 768px) {
            .suite-grid { grid-template-columns: 1fr; }
            .control-panel { position: static; }
        }
    </style>
</head>
<body>
    <!-- ── Header ──────────────────────────────────────────── -->
    <div class="suite-header">
        <div class="logo">SW</div>
        <h1><span>SoliWel</span> Validation Suite</h1>
        <span class="badge-version">API 510 · 570 · 653 · ASME I</span>
    </div>

    <!-- ── Main Container ──────────────────────────────────── -->
    <div class="suite-container">
        <div class="suite-grid">

            <!-- ── Control Panel ─────────────────────────────── -->
            <div class="control-panel">
                <div class="panel-card">
                    <div class="panel-card-header">Test Control</div>
                    <div class="panel-card-body">
                        <p style="font-size:0.75rem; color:var(--sw-text-dim); margin-bottom:0.75rem;">
                            Validates the ASME/API calculation engine against known reference values.
                        </p>
                        <button id="btn-run-tests" class="btn-run">
                            <span class="spinner"></span>
                            <i class="bi bi-play-fill icon"></i>
                            <span class="label">Run Tests</span>
                        </button>
                        <div style="height:8px"></div>
                        <button onclick="window.location.href='index.html'" class="btn-back">
                            <i class="bi bi-arrow-left"></i> Back to SoliWel
                        </button>
                    </div>
                </div>

                <div class="panel-card" id="scoreboard-card" style="display:none;">
                    <div class="panel-card-header">Results</div>
                    <div class="panel-card-body">
                        <div class="scoreboard">
                            <div class="score-cell pass">
                                <div class="score-val" id="pass-count">0</div>
                                <div class="score-label">Passed</div>
                            </div>
                            <div class="score-cell fail">
                                <div class="score-val" id="fail-count">0</div>
                                <div class="score-label">Failed</div>
                            </div>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
                        </div>
                        <div class="progress-pct" id="progress-pct"></div>
                    </div>
                </div>

                <div class="panel-card" id="coverage-card" style="display:none;">
                    <div class="panel-card-header">Coverage</div>
                    <div class="panel-card-body" id="coverage-body" style="font-size:0.75rem; color:var(--sw-text-dim);">
                    </div>
                </div>
            </div>

            <!-- ── Results Area ──────────────────────────────── -->
            <div class="results-area" id="test-results-container">
                <div class="results-placeholder">
                    <i class="bi bi-shield-check"></i>
                    <p>Click <strong>Run Tests</strong> to validate the integrity engine.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ── Dependencies ────────────────────────────────────── -->
    <script src="js/data/PipeSchedules.js"></script>
    <script src="js/core/entities/UTCalculations.js"></script>
    <script src="js/tests/integrity_suite.js"></script>

    <script>
        document.getElementById('btn-run-tests').addEventListener('click', async () => {
            const btn = document.getElementById('btn-run-tests');
            const container = document.getElementById('test-results-container');
            const scorecard = document.getElementById('scoreboard-card');
            const coverageCard = document.getElementById('coverage-card');

            btn.classList.add('running');
            btn.disabled = true;
            btn.querySelector('.label').textContent = 'Validating…';
            container.innerHTML = '<div class="results-placeholder"><div class="spinner" style="width:28px;height:28px;border:3px solid var(--sw-border);border-top-color:var(--sw-gold);border-radius:50%;animation:spin 0.6s linear infinite;"></div><p style="margin-top:1rem;">Running validation battery…</p></div>';

            try {
                const results = await window.NDT.tests.runAllTests();
                container.innerHTML = '';
                scorecard.style.display = 'block';
                coverageCard.style.display = 'block';

                let passes = 0;
                let fails = 0;
                let currentSection = '';

                // Categorize tests into sections
                const sections = {
                    'DB:': '📋 Database Lookups',
                    'API 5': '🔧 API Standard Calculations',
                    'ASME': '🔧 ASME Standard Calculations',
                    'Metrics:': '📊 Integrity Metrics',
                    'Risk:': '⚠️ Critical Thresholds',
                    'Edge:': '🧪 Edge Cases'
                };

                results.forEach((res, i) => {
                    if (res.status === 'PASS') passes++; else fails++;

                    // Detect section
                    for (const [prefix, label] of Object.entries(sections)) {
                        if (res.name.startsWith(prefix) && label !== currentSection) {
                            currentSection = label;
                            const sHeader = document.createElement('div');
                            sHeader.className = 'test-section-header';
                            sHeader.textContent = label;
                            container.appendChild(sHeader);
                            break;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = `test-card ${res.status.toLowerCase()}`;
                    card.style.animationDelay = `${i * 40}ms`;
                    card.innerHTML = `
                        <div class="test-card-inner">
                            <div class="test-icon">
                                <i class="bi bi-${res.status === 'PASS' ? 'check-lg' : 'x-lg'}"></i>
                            </div>
                            <div class="test-name">${res.name}</div>
                            <div class="test-details" title="${res.details}">${res.details}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Update scoreboard
                document.getElementById('pass-count').textContent = passes;
                document.getElementById('fail-count').textContent = fails;

                const total = passes + fails;
                const pct = total > 0 ? Math.round((passes / total) * 100) : 0;
                const progressFill = document.getElementById('progress-fill');
                progressFill.style.width = `${pct}%`;
                progressFill.className = `progress-fill${fails > 0 ? ' has-errors' : ''}`;
                document.getElementById('progress-pct').textContent = `${pct}% pass rate (${total} tests)`;

                // Coverage summary
                document.getElementById('coverage-body').innerHTML = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">
                        <span>API 570 Barlow</span><span style="text-align:right;">✓</span>
                        <span>API 510 Vessels</span><span style="text-align:right;">✓</span>
                        <span>ASME Sec I</span><span style="text-align:right;">✓</span>
                        <span>Pipe Schedules</span><span style="text-align:right;">✓</span>
                        <span>Corrosion Rate</span><span style="text-align:right;">✓</span>
                        <span>Remnant Life</span><span style="text-align:right;">✓</span>
                        <span>Edge Cases</span><span style="text-align:right;">✓</span>
                    </div>
                `;

            } catch (err) {
                container.innerHTML = `<div style="background:var(--sw-fail-bg);border:1px solid var(--sw-fail);border-radius:10px;padding:1.5rem;"><strong style="color:var(--sw-fail);">Critical Error</strong><p style="margin:0.5rem 0 0;font-size:0.85rem;color:var(--sw-text-dim);">${err.message}</p><pre style="font-size:0.7rem;color:var(--sw-text-dim);margin-top:0.5rem;">${err.stack || ''}</pre></div>`;
            } finally {
                btn.classList.remove('running');
                btn.disabled = false;
                btn.querySelector('.label').textContent = 'Run Tests';
            }
        });
    </script>
</body>
</html>
